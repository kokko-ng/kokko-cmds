name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The jobs themselves live in plugin-repo-ci.yml so kokko-janitor can reuse
  # them. This repo ships the hooks, so it opts into the bats suite.
  plugin-repo:
    uses: ./.github/workflows/plugin-repo-ci.yml
    with:
      run-hook-tests: true

  # A release must not go out with the marketplace and manifests claiming a
  # version that nothing bumped. Cheap to check, easy to forget.
  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change under plugins/ must come with a version bump
        run: bash scripts/check-version-bumped.sh "origin/${{ github.base_ref }}"
