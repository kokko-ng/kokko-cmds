name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.6.0); created at the dispatched ref if it does not exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release for the current version (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --generate-notes

  # Tell kokko-devcontainer to re-check its plugin roster. Its
  # settings.json hardcodes plugin names from this marketplace; a rename or
  # removal here silently breaks it, because post-create.sh treats a failed
  # plugin install as non-fatal by design.
  #
  # Needs a PAT with `repo` scope on kokko-ng/kokko-devcontainer, stored as
  # DEVCONTAINER_DISPATCH_TOKEN. Without the secret this step is skipped rather
  # than failing the release -- the devcontainer's own weekly schedule still
  # catches the drift, just later.
  notify-devcontainer:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the devcontainer roster check
        env:
          TOKEN: ${{ secrets.DEVCONTAINER_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "DEVCONTAINER_DISPATCH_TOKEN is not set - skipping the roster notification."
            echo "kokko-devcontainer will still catch any drift on its weekly schedule."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/kokko-ng/kokko-devcontainer/dispatches \
            -d '{"event_type":"marketplace-updated"}'
          echo "Dispatched marketplace-updated to kokko-ng/kokko-devcontainer"
